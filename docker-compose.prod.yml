version: '3.8'

# ============================================================
#  Sparktree Sparkbots — docker-compose.prod.yml
#  Uso: docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:

  # ─── Redis (cola de mensajes + cache) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: sparktree-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Node.js + Express) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparktree-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # URLs
      - FRONTEND_URL=${FRONTEND_URL}
      # WhatsApp auth sessions storage
      - AUTH_STATE_PATH=/app/whatsapp_sessions
      # AI Keys (opcional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Timeouts
      - REQUEST_TIMEOUT_MS=15000
    volumes:
      # Persistir sesiones de WhatsApp (CRÍTICO — sin esto pierdes las sesiones al reiniciar)
      - whatsapp_sessions:/app/whatsapp_sessions
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ─── Frontend (React + Vite → Nginx) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: sparktree-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # ─── Nginx (Reverse Proxy + SSL) ──────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: sparktree-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro        # Cloudflare origin certificates
    depends_on:
      - backend
      - frontend

volumes:
  redis_data:
  whatsapp_sessions:   # Volumen persistente para sesiones de WhatsApp
